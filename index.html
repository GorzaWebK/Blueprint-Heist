<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>Blueprint Heist – a stealth caper on a living blueprint</title>
    <meta name="description" content="Blueprint Heist is a top-down stealth heist game drawn as a living architect's blueprint. Sneak past guards, cameras and lasers, steal the target and slip out. 12 sheets, three buildings." />
    <meta name="theme-color" content="#0d3866" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Blueprint Heist" />
    <meta property="og:description" content="A top-down stealth heist drawn as a living cyanotype blueprint. Twelve sheets, three buildings, one red pencil mark." />
    <meta name="twitter:card" content="summary" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Favicon drawn in code (inline SVG). main.js swaps in a canvas-drawn version once loaded. -->
    <link
      rel="icon"
      id="favicon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%230d3866'/%3E%3Crect x='9' y='9' width='46' height='46' fill='none' stroke='%23eaf3ff' stroke-width='4'/%3E%3Ccircle cx='44' cy='20' r='6' fill='%23eaf3ff'/%3E%3Ccircle cx='22' cy='44' r='5' fill='%23ff4b3e'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="game" class="booting">
      <canvas id="view" aria-label="Blueprint Heist"></canvas>

      <!-- In-game HUD: an architect's title block, plus two small corner buttons. -->
      <div id="hud" hidden>
        <div class="corner">
          <button class="pin-btn" id="btn-pause" aria-label="Pause" title="Pause (Esc)">
            <svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12" /></svg>
          </button>
          <button class="pin-btn" id="btn-mute" aria-label="Mute" title="Mute (M)">
            <svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" /><path class="wave" d="M16 9q2 3 0 6M18.5 7q4 5 0 10" /><path class="slash" d="M16 8l6 8" /></svg>
          </button>
        </div>
        <div id="status" aria-live="polite"></div>
        <table id="titleblock" aria-label="Title block">
          <tr class="tb-r1">
            <td class="tb-sheet"><span class="tb-k">SHEET</span><span id="tb-sheet" class="num">01/12</span></td>
            <td colspan="2" class="tb-title"><span class="tb-k"><span id="tb-project">BLUEPRINT HEIST</span> &middot; <span id="tb-building">MUSEUM</span></span><span id="tb-title">ENTRANCE HALL</span></td>
          </tr>
          <tr class="tb-r2">
            <td><span class="tb-k">TIME</span><span id="tb-time" class="num">00:00.0</span></td>
            <td><span class="tb-k">LOOT</span><span id="tb-loot" class="num">0/0</span></td>
            <td><span class="tb-k">SPOTTED</span><span id="tb-spotted" class="num">0</span></td>
          </tr>
          <tr class="tb-r3">
            <td colspan="3" class="tb-obj"><span id="tb-obj">STEAL THE TARGET</span><span id="tb-tools"></span></td>
          </tr>
        </table>
      </div>

      <!-- Touch controls (shown after the first touch). -->
      <div id="touch" hidden>
        <div id="stick-zone"></div>
        <div id="stick"><div id="stick-knob"></div></div>
        <div class="tbtns">
          <button data-touch="use" class="tbtn t-use">USE</button>
          <button data-touch="throw" class="tbtn t-throw">THROW</button>
          <button data-touch="sprint" class="tbtn t-sprint">SPRINT</button>
          <button data-touch="sneak" class="tbtn t-sneak">SNEAK</button>
        </div>
      </div>

      <!-- Sheet intro card. -->
      <div id="intro" hidden></div>

      <!-- Menus: sheets of tracing paper pinned with drafting tape. Built by ui.js. -->
      <div id="screens"></div>

      <div id="loading">
        <span>Unrolling the plans…</span>
      </div>
      <noscript><p class="noscript">Blueprint Heist needs JavaScript to run.</p></noscript>
    </div>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
